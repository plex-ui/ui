# Codex UI metadata for the Plex UI skill.
# Spec: https://developers.openai.com/codex/skills/create-skill
interface:
  display_name: "Plex UI"
  short_description: "Install, compose, and style UI with @plexui/ui: correct imports, unified size scale, semantic colors, dark mode, and 652 icons."
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.png"
  brand_color: "#000000"
  default_prompt: "Use Plex UI components. Import from @plexui/ui/components/<Folder>, use the unified size prop (3xs to 3xl), semantic color props (primary, danger, success, warning, etc.), the variant values each component accepts (Button: solid, soft, outline, ghost), and Plex UI utility classes (text-primary, bg-surface, border-default). Switch dark mode with data-theme=\"dark\" on <html>; color-scheme alone does not switch shadows or dark: utilities."

policy:
  # Auto-invoke when user works with @plexui/ui imports or Plex UI components.
  allow_implicit_invocation: true
