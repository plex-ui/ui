name: Release packages

# Releases every package whose package.json version is not on npm yet, after
# the parity tests pass, in dependency order: @plexui/styles, then @plexui/ui
# and @plexui/vue (both depend on it), then @plexui/mcp. Then it tags what it
# published and opens the GitHub Release v<ui version> with that version's
# section of the docs changelog.
#
# Runs when a version bump reaches master (`npm run release:bump`, then merge),
# or by hand from the Actions tab: a dry run by default, which builds, tests
# and packs everything but uploads nothing. Only master can really publish.
#
# Auth: npm Trusted Publishing (OIDC, with provenance) for packages that have
# this workflow file set as their trusted publisher. A package that is not on
# npm yet cannot have one, so its first publish falls back to the
# NPM_BOOTSTRAP_TOKEN repository secret (a granular token with publish access
# to @plexui) when it is set. Delete that secret once every package has a
# trusted publisher. (NPM_TOKEN is the token used before OIDC; it is not read.)
# Keep this file's name: the trusted publisher settings on npm point at it.

on:
  push:
    branches: [master]
    paths:
      - packages/styles/package.json
      - packages/ui/package.json
      - packages/vue/package.json
      - packages/mcp/package.json

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, test and pack, but publish nothing"
        type: boolean
        default: true

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'plex-ui/ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and the GitHub Release
      id-token: write # npm Trusted Publishing and provenance
    env:
      # Without the secret, setup-node's own placeholder, as before: OIDC only
      NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN || 'XXXXX-XXXXX-XXXXX-XXXXX' }}
      DRY_RUN: ${{ github.ref != 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check which versions are already published
        id: check
        run: |
          any=skip
          for pkg in styles ui vue mcp; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$(npm view "@plexui/$pkg@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$pkg=skip" >> "$GITHUB_OUTPUT"
              echo "@plexui/$pkg@$version is already on npm, skipping."
            else
              echo "$pkg=publish" >> "$GITHUB_OUTPUT"
              any=publish
              echo "@plexui/$pkg@$version will be published."
            fi
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then echo "Dry run: nothing will be uploaded."; fi

      # The tests and the ui and vue builds read the workspace styles' dist
      - name: Build @plexui/styles
        if: steps.check.outputs.any == 'publish'
        run: npm run build:styles

      - name: Run the parity tests
        if: steps.check.outputs.any == 'publish'
        run: npm run test:parity

      - name: Publish @plexui/styles
        id: publish_styles
        if: steps.check.outputs.styles == 'publish'
        working-directory: packages/styles
        run: |
          if [ "$DRY_RUN" = "true" ]; then npm publish --access public --dry-run
          else npm publish --access public --provenance; fi

      - name: Wait for @plexui/styles to reach the registry
        if: steps.check.outputs.styles == 'publish' && env.DRY_RUN != 'true' && (steps.check.outputs.ui == 'publish' || steps.check.outputs.vue == 'publish')
        run: |
          version=$(node -p "require('./packages/styles/package.json').version")
          for attempt in $(seq 1 30); do
            if [ "$(npm view "@plexui/styles@$version" version 2>/dev/null)" = "$version" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "@plexui/styles@$version is still not visible on npm after 5 minutes."
          exit 1

      - name: Build and check @plexui/ui
        if: steps.check.outputs.ui == 'publish'
        env:
          STYLES: ${{ steps.check.outputs.styles }}
        run: |
          npm run build:ui
          if [ "$DRY_RUN" = "true" ] && [ "$STYLES" = "publish" ]; then
            echo "Dry run: the new @plexui/styles is not on npm, so check-styles-published is skipped."
          else
            node scripts/check-styles-published.mjs ui
          fi
          node scripts/check-published-types.mjs ui

      - name: Publish @plexui/ui
        id: publish_ui
        if: steps.check.outputs.ui == 'publish'
        working-directory: packages/ui
        run: |
          if [ "$DRY_RUN" = "true" ]; then npm publish --access public --dry-run
          else npm publish --access public --provenance; fi

      - name: Build and check @plexui/vue
        if: steps.check.outputs.vue == 'publish'
        env:
          STYLES: ${{ steps.check.outputs.styles }}
        run: |
          npm run build:vue
          if [ "$DRY_RUN" = "true" ] && [ "$STYLES" = "publish" ]; then
            echo "Dry run: the new @plexui/styles is not on npm, so check-styles-published is skipped."
          else
            node scripts/check-styles-published.mjs vue
          fi
          node scripts/check-published-types.mjs vue

      - name: Publish @plexui/vue
        id: publish_vue
        if: steps.check.outputs.vue == 'publish'
        working-directory: packages/vue
        run: |
          if [ "$DRY_RUN" = "true" ]; then npm publish --access public --dry-run
          else npm publish --access public --provenance; fi

      # prebuild regenerates the component manifests from the docs content
      - name: Build @plexui/mcp
        if: steps.check.outputs.mcp == 'publish'
        run: npm run build:mcp

      - name: Publish @plexui/mcp
        id: publish_mcp
        if: steps.check.outputs.mcp == 'publish'
        working-directory: packages/mcp
        run: |
          if [ "$DRY_RUN" = "true" ]; then npm publish --access public --dry-run
          else npm publish --access public --provenance; fi

      # Also after a failed step, and on a manual run with nothing to publish:
      # every version this run published or npm already has gets its tag and
      # the ui Release when they are missing. A version published a moment
      # ago counts by its step's outcome, because npm can take minutes to
      # serve it.
      - name: Tag the published versions and create the GitHub Release
        if: always() && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_styles: ${{ steps.publish_styles.outcome }}
          PUBLISHED_ui: ${{ steps.publish_ui.outcome }}
          PUBLISHED_vue: ${{ steps.publish_vue.outcome }}
          PUBLISHED_mcp: ${{ steps.publish_mcp.outcome }}
        run: |
          on_npm() {
            published="PUBLISHED_$1"
            [ "${!published}" = "success" ] || [ "$(npm view "@plexui/$1@$2" version 2>/dev/null)" = "$2" ]
          }
          also=""
          for pkg in styles vue mcp; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            tag="@plexui/$pkg@$version"
            if on_npm "$pkg" "$version" && [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
              also="$also- \`$tag\`"$'\n'
            fi
          done

          version=$(node -p "require('./packages/ui/package.json').version")
          if on_npm ui "$version" && ! gh release view "v$version" > /dev/null 2>&1; then
            if ! node scripts/release-notes.mjs "$version" > release-notes.md; then
              echo "See https://plexui.com/docs/changelog" > release-notes.md
            fi
            if [ -n "$also" ]; then
              printf '\n### Also published\n\n%s' "$also" >> release-notes.md
            fi
            gh release create "v$version" --title "v$version" --target "$GITHUB_SHA" --notes-file release-notes.md
          fi
